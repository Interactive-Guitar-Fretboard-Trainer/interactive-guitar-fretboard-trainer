<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Guitar Fretboard Trainer</title>
    <style>
      :root {
        /* base tokens */
        --font-family: Arial, sans-serif;
        --page-padding: 20px;
        --radius: 10px;
        --gap: 12px;
        --control-padding: 16px;
        --control-input-padding: 8px;
        --control-font-size: 14px;
        --transition-fast: 0.15s ease;
        --transition-medium: 0.2s ease;
      
        /* light theme colors */
        --bg: #f5f5f5;
        --text: #111;
        --surface: #fff;
        --muted-border: #ddd;
        --control-border: #ccc;
        --thead-bg: #eee;
        --cell-border: #999;
        --hover-bg: #f0f0f0;
      
        /* legend/badge defaults (used as fallbacks) */
        --badge-root: gold;
        --badge-scale: #7ec8ff;
        --badge-triad: #9eff9e;
        --badge-seventh: #ffb6c1;
        --badge-interval: #ffde91;
        --badge-previous: #ffb0b0;
        --badge-next: #a8ffb0;
      
        /* colors used in dark mode for text on badges */
        --badge-dark-text: #333;
        --badge-dark-hover-text: #ccc;
      }
      
      /* dark theme overrides */
      body.dark {
        --bg: #000;
        --text: #f3f4f6;
        --surface: #333;
        --muted-border: #374151;
        --control-border: #4b5563;
        --thead-bg: #555;
        --cell-border: #4b5563;
        --hover-bg: #555;
      
        /* badges keep same background, but text on them should be darker for contrast */
        --badge-dark-text: #333;
        --badge-dark-hover-text: #ccc;
      }
      
       {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-family);
        margin: 0;
        padding: var(--page-padding);
        background: var(--bg);
        color: var(--text);
        transition: background var(--transition-medium),
          color var(--transition-medium);
      }
      
      h1 {
        margin-top: 0;
      }
      
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: var(--gap);
        margin-bottom: 20px;
        background: var(--surface);
        padding: var(--control-padding);
        border-radius: var(--radius);
        border: 1px solid var(--muted-border);
        transition: background var(--transition-medium),
          border-color var(--transition-medium);
      }
      
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      
      label {
        font-size: var(--control-font-size);
        font-weight: bold;
      }
      
      select,
      button {
        padding: var(--control-input-padding);
        font-size: var(--control-font-size);
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--control-border);
        border-radius: 6px;
      }
      
      .table-wrapper {
        overflow-x: auto;
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--muted-border);
        padding: 12px;
        transition: background var(--transition-medium),
          border-color var(--transition-medium);
      }
      
      table {
        border-collapse: collapse;
        width: max-content;
        min-width: 100%;
      }
      
      th,
      td {
        border: 1px solid var(--cell-border);
        width: 48px;
        height: 48px;
        text-align: center;
        vertical-align: middle;
        user-select: none;
        position: relative;
      }
      
      td {
        cursor: pointer;
        transition: background var(--transition-fast);
      }
      
      thead th {
        background: var(--thead-bg);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      
      tbody th {
        background: var(--thead-bg);
        position: sticky;
        left: 0;
        z-index: 1;
      }
      
      td:hover {
        background: var(--hover-bg);
      }
      
      /* badge / cell color utilities */
      .root {
        background: var(--badge-root);
        font-weight: bold;
      }
      .scale {
        background: var(--badge-scale);
      }
      .triad {
        background: var(--badge-triad);
      }
      .seventh {
        background: var(--badge-seventh);
      }
      .interval {
        background: var(--badge-interval);
      }
      .previous {
        background: var(--badge-previous);
      }
      .next {
        background: var(--badge-next);
      }
      
      /* dark-mode badge text color + hover */
      body.dark td.root,
      body.dark td.scale,
      body.dark td.triad,
      body.dark td.seventh,
      body.dark td.interval,
      body.dark td.previous,
      body.dark td.next {
        color: var(--badge-dark-text);
      }
      
      body.dark td.root:hover,
      body.dark td.scale:hover,
      body.dark td.triad:hover,
      body.dark td.seventh:hover,
      body.dark td.interval:hover,
      body.dark td.previous:hover,
      body.dark td.next:hover {
        color: var(--badge-dark-hover-text);
      }
      
      /* header/footer color adjustments in dark mode (driven by variables) */
      body.dark thead th,
      body.dark tbody th {
        background: var(--thead-bg);
        color: var(--text);
      }
      
      body.dark td {
        color: var(--text);
        border-color: var(--cell-border);
      }
      
      body.dark th {
        border-color: var(--cell-border);
      }
      
      .marker::after {
        content: "•";
        position: absolute;
        bottom: 2px;
        right: 4px;
        font-size: 12px;
        opacity: 0.5;
      }
      
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap);
        margin-top: 16px;
        font-size: 14px;
      }
      
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      
      .legend-color {
        width: 18px;
        height: 18px;
        border: 1px solid var(--cell-border);
      }
      
      /* responsive tweak */
      @media (max-width: 700px) {
        th,
        td {
          width: 42px;
          height: 42px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>

    <h1>Interactive Guitar Fretboard Trainer</h1>
    
    <div class="controls">
    
      <div class="control-group">
        <label>Mode</label>
        <select id="mode">
          <option value="notes">Matching Notes</option>
          <option value="fifths">Circle of Fifths</option>
          <option value="major-scale">Major Scale</option>
          <option value="minor-pentatonic">Minor Pentatonic</option>
          <option value="major-triad">Major Triad</option>
          <option value="minor-triad">Minor Triad</option>
          <option value="dominant-7">Dominant 7</option>
          <option value="intervals">Intervals</option>
        </select>
      </div>
    
      <div class="control-group">
        <label>Tuning Preset</label>
        <select id="tuning">
    
          <option value="bass-standard">4 String Bass - Standard (E)</option>
          <option value="bass-drop-d">4 String Bass - Drop D</option>
          <option value="bass-d-standard">4 String Bass - D Standard</option>
    
          <option disabled>──────────</option>
    
          <option value="bass-5-standard">
            5 String Bass - Standard (B)
          </option>
    
          <option value="bass-5-tenor">
            5 String Bass - Tenor
          </option>
    
          <option value="bass-5-drop-a">
            5 String Bass - Drop A
          </option>
          
          <option value="bass-5-a-standard">
            5 String Bass - A Standard
          </option>
    
          <option disabled>──────────</option>
    
          <option value="standard" selected>6 String Guitar - Standard (E)</option>
          <option value="drop-d">6 String Guitar - Drop D</option>
          <option value="d-standard">6 String Guitar - D Standard</option>
    
          <option disabled>──────────</option>
    
          <option value="7-standard">7 String Guitar - Standard (B)</option>
          <option value="7-drop-a">7 String Guitar - Drop A</option>
          <option value="7-a-standard">7 String Guitar - A Standard</option>
          <option value="7-drop-g">7 String Guitar - Drop G</option>
    
        </select>
      </div>
    
      <div class="control-group">
        <label>Orientation</label>
        <select id="orientation">
          <option value="right" selected>Right Handed</option>
          <option value="left">Left Handed</option>
        </select>
      </div>
    
      <div class="control-group">
        <label>Interval</label>
        <select id="interval-select">
          <option value="1">Root</option>
          <option value="2">Major 2nd</option>
          <option value="3">Major 3rd</option>
          <option value="4">Perfect 4th</option>
          <option value="5" selected>Perfect 5th</option>
          <option value="7">Minor 7th</option>
          <option value="12">Octave</option>
        </select>
      </div>
    
      <div class="control-group">
        <label>Audio</label>
        <button id="toggle-audio">Audio: OFF</button>
      </div>
    
      <div class="control-group">
        <label>Theme</label>
        <button id="toggle-theme">Dark Mode</button>
      </div>
    
    </div>
    
    <div class="table-wrapper">
      <div id="table-container"></div>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color root"></div>
        Root
      </div>
    
      <div class="legend-item">
        <div class="legend-color scale"></div>
        Scale Tone
      </div>
    
      <div class="legend-item">
        <div class="legend-color triad"></div>
        Triad Tone
      </div>
    
      <div class="legend-item">
        <div class="legend-color seventh"></div>
        7th Tone
      </div>
    
      <div class="legend-item">
        <div class="legend-color interval"></div>
        Interval
      </div>
    </div>

    <script>
      const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      
      const TUNINGS = {
        // 4 string bass
        "bass-standard": ["G", "D", "A", "E"],
        "bass-drop-d": ["G", "D", "A", "D"],
        "bass-d-standard": ["F", "C", "G", "D"],
      
        // 5 string bass
        "bass-5-standard": ["G", "D", "A", "E", "B"],
        "bass-5-tenor": ["C", "G", "D", "A", "E"],
        "bass-5-drop-a": ["G", "D", "A", "E", "A"],
        "bass-5-a-standard": ["F", "C", "G", "D", "A"],
      
        // 6 string guitar
        standard: ["e", "B", "G", "D", "A", "E"],
        "drop-d": ["e", "B", "G", "D", "A", "D"],
        "d-standard": ["d", "A#", "F", "C", "G", "D"],
      
        // 7 string guitar
        "7-standard": ["e", "B", "G", "D", "A", "E", "B"],
        "7-drop-a": ["e", "B", "G", "D", "A", "E", "A"],
        "7-a-standard": ["d", "A", "F", "C", "G", "D", "A"],
        "7-drop-g": ["d", "A", "F", "C", "G", "D", "G"]
      };
      
      const SCALES = {
        major: [0, 2, 4, 5, 7, 9, 11],
        pentatonicMinor: [0, 3, 5, 7, 10],
        majorTriad: [0, 4, 7],
        minorTriad: [0, 3, 7],
        dominant7: [0, 4, 7, 10]
      };
      
      const CIRCLE_OF_FIFTHS = [
        "C",
        "G",
        "D",
        "A",
        "E",
        "B",
        "F#",
        "C#",
        "G#",
        "D#",
        "A#",
        "F"
      ];
      
      let audioEnabled = false;
      
      const tableContainer = document.getElementById("table-container");
      const modeSelect = document.getElementById("mode");
      // string count selector removed; determined automatically from tuning preset
      const tuningSelect = document.getElementById("tuning");
      const orientationSelect = document.getElementById("orientation");
      const intervalSelect = document.getElementById("interval-select");
      const audioButton = document.getElementById("toggle-audio");
      const themeButton = document.getElementById("toggle-theme");
      
      audioButton.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        audioButton.textContent = `Audio: ${audioEnabled ? "ON" : "OFF"}`;
      });
      
      themeButton.addEventListener("click", () => {
        document.body.classList.toggle("dark");
      
        const isDark = document.body.classList.contains("dark");
      
        themeButton.textContent = isDark ? "Light Mode" : "Dark Mode";
      
        localStorage.setItem("fretboard-dark-mode", isDark);
      });
      
      const savedTheme = localStorage.getItem("fretboard-dark-mode");
      
      if (savedTheme === "true") {
        document.body.classList.add("dark");
        themeButton.textContent = "Light Mode";
      }
      
      function normalize(note) {
        return note.toUpperCase();
      }
      
      function noteIndex(note) {
        return NOTES.indexOf(normalize(note));
      }
      
      function buildString(openNote, frets = 12) {
        const output = [];
        const start = noteIndex(openNote);
      
        for (let i = 0; i <= frets; i++) {
          output.push(NOTES[(start + i) % NOTES.length]);
        }
      
        return output;
      }
      
      function generateChart() {
        const tuning = tuningSelect.value;
        let notes = [...TUNINGS[tuning]];
      
        if (orientationSelect.value === "left") {
          notes.reverse();
        }
      
        return notes.map((note) => ({
          open: note,
          notes: buildString(note)
        }));
      }
      
      function clearHighlights() {
        document.querySelectorAll("td").forEach((cell) => {
          cell.className = "";
        });
      }
      
      function highlightMatching(root) {
        document.querySelectorAll("td").forEach((cell) => {
          if (cell.dataset.note === root) {
            cell.classList.add("root");
          }
        });
      }
      
      function highlightCircle(root) {
        const index = CIRCLE_OF_FIFTHS.indexOf(root);
      
        if (index === -1) return;
      
        const previous =
          CIRCLE_OF_FIFTHS[
            (index - 1 + CIRCLE_OF_FIFTHS.length) % CIRCLE_OF_FIFTHS.length
          ];
      
        const next = CIRCLE_OF_FIFTHS[(index + 1) % CIRCLE_OF_FIFTHS.length];
      
        document.querySelectorAll("td").forEach((cell) => {
          if (cell.dataset.note === root) {
            cell.classList.add("root");
          }
      
          if (cell.dataset.note === previous) {
            cell.classList.add("previous");
          }
      
          if (cell.dataset.note === next) {
            cell.classList.add("next");
          }
        });
      }
      
      function highlightPattern(root, intervals, className) {
        const rootIndex = noteIndex(root);
      
        const notes = intervals.map((i) => {
          return NOTES[(rootIndex + i) % NOTES.length];
        });
      
        document.querySelectorAll("td").forEach((cell) => {
          if (cell.dataset.note === root) {
            cell.classList.add("root");
          }
      
          if (notes.includes(cell.dataset.note)) {
            cell.classList.add(className);
          }
        });
      }
      
      function highlightInterval(root, interval) {
        const rootIndex = noteIndex(root);
        const target = NOTES[(rootIndex + interval) % NOTES.length];
      
        document.querySelectorAll("td").forEach((cell) => {
          if (cell.dataset.note === root) {
            cell.classList.add("root");
          }
      
          if (cell.dataset.note === target) {
            cell.classList.add("interval");
          }
        });
      }
      
      function playFrequency(note) {
        if (!audioEnabled) return;
      
        const frequencies = {
          C: 261.63,
          "C#": 277.18,
          D: 293.66,
          "D#": 311.13,
          E: 329.63,
          F: 349.23,
          "F#": 369.99,
          G: 392.0,
          "G#": 415.3,
          A: 440.0,
          "A#": 466.16,
          B: 493.88
        };
      
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
      
        osc.type = "sine";
        osc.frequency.value = frequencies[note];
      
        osc.connect(gain);
        gain.connect(audioCtx.destination);
      
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
      
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      }
      
      function renderTable() {
        tableContainer.innerHTML = "";
      
        const chart = generateChart();
      
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");
      
        table.appendChild(thead);
        table.appendChild(tbody);
      
        const headerRow = document.createElement("tr");
      
        for (let i = 0; i <= 12; i++) {
          const th = document.createElement("th");
          th.textContent = i;
      
          if ([3, 5, 7, 9, 12].includes(i)) {
            th.classList.add("marker");
          }
      
          headerRow.appendChild(th);
        }
      
        thead.appendChild(headerRow);
      
        chart.forEach((string) => {
          const tr = document.createElement("tr");
      
          string.notes.forEach((note, index) => {
            if (index === 0) {
              const th = document.createElement("th");
              th.textContent = note;
              tr.appendChild(th);
              return;
            }
      
            const td = document.createElement("td");
            td.textContent = note;
            td.dataset.note = note;
      
            td.addEventListener("click", () => {
              clearHighlights();
      
              const mode = modeSelect.value;
              const root = note;
      
              playFrequency(root);
      
              switch (mode) {
                case "notes":
                  highlightMatching(root);
                  break;
      
                case "fifths":
                  highlightCircle(root);
                  break;
      
                case "major-scale":
                  highlightPattern(root, SCALES.major, "scale");
                  break;
      
                case "minor-pentatonic":
                  highlightPattern(root, SCALES.pentatonicMinor, "scale");
                  break;
      
                case "major-triad":
                  highlightPattern(root, SCALES.majorTriad, "triad");
                  break;
      
                case "minor-triad":
                  highlightPattern(root, SCALES.minorTriad, "triad");
                  break;
      
                case "dominant-7":
                  highlightPattern(root, SCALES.dominant7, "seventh");
                  break;
      
                case "intervals":
                  highlightInterval(root, Number(intervalSelect.value));
                  break;
              }
            });
      
            tr.appendChild(td);
          });
      
          tbody.appendChild(tr);
        });
      
        tableContainer.appendChild(table);
      }
      
      [tuningSelect, orientationSelect].forEach((control) => {
        control.addEventListener("change", renderTable);
      });
      
      renderTable();
    </script>
  </body>
</html>
